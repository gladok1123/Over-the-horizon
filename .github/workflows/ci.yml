name: CI & Playable Release

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore OverHorizon.sln

      - name: Build (Release, warnings as errors)
        shell: bash
        run: |
          set -o pipefail
          dotnet build OverHorizon.sln --configuration Release --no-restore -warnaserror 2>&1 | tee build.log || {
            echo "### Build Errors (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error [A-Z0-9]+:" build.log | head -n 80 >> "$GITHUB_STEP_SUMMARY" || tail -n 80 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Run unit & architecture tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/OverHorizon.Tests/OverHorizon.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" 2>&1 | tee test.log || {
            grep -E "Failed |Error Message:|Expected |Stack Trace:|at OverHorizon" test.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "### Test Failures (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "### Passed (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Passed!|Total tests:" test.log >> "$GITHUB_STEP_SUMMARY" || tail -n 15 test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build-and-test-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test (macOS)
        run: dotnet test OverHorizon.sln --configuration Release -warnaserror --verbosity minimal

  package-and-release:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package self-contained builds (Windows, Linux, macOS)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-zips
          for rid in win-x64 linux-x64 osx-arm64 osx-x64; do
            pkg_name="OverHorizon-v0.3.0-alpha-${rid}"
            stage_dir="stage/${pkg_name}"
            mkdir -p "${stage_dir}"

            dotnet publish src/OverHorizon.Server/OverHorizon.Server.csproj \
              -c Release -r "${rid}" --self-contained true \
              -p:DebugType=None -p:DebugSymbols=false \
              -o "${stage_dir}"

            dotnet publish src/OverHorizon.Client/OverHorizon.Client.csproj \
              -c Release -r "${rid}" --self-contained true \
              -p:DebugType=None -p:DebugSymbols=false \
              -o "${stage_dir}"

            cp scripts/HOW-TO-PLAY-RU.txt "${stage_dir}/"
            if [[ "${rid}" == "win-x64" ]]; then
              cp scripts/*.bat "${stage_dir}/"
            else
              cp scripts/*.sh "${stage_dir}/"
              chmod +x "${stage_dir}"/*.sh "${stage_dir}/OverHorizon.Server" "${stage_dir}/OverHorizon.Client"
            fi

            (cd stage && zip -r -q "../release-zips/${pkg_name}.zip" "${pkg_name}")
          done
          ls -lh release-zips/

      - name: Upload Playable Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OverHorizon-v0.3.0-alpha-playable-builds
          path: release-zips/*.zip
          retention-days: 30

      - name: Publish or Update GitHub Pre-Release v0.3.0-alpha
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.3.0-alpha"
          NOTES=$'### Over-the-Horizon: C# EDITION (`v0.3.0-alpha`) — Поддержка реальных PNG/WAV ассетов (`Download-Real-Assets.bat`), прыжок 1.27 блока, плавный мультиплеер и межчанковый свет!\n\nГотовые самодостаточные сборки (установка .NET **не требуется**):\n- **Windows 10/11 (x64)**: `OverHorizon-v0.3.0-alpha-win-x64.zip`\n- **Linux (x86_64)**: `OverHorizon-v0.3.0-alpha-linux-x64.zip`\n- **macOS Apple Silicon (M1–M4)**: `OverHorizon-v0.3.0-alpha-osx-arm64.zip`\n- **macOS Intel (x64)**: `OverHorizon-v0.3.0-alpha-osx-x64.zip`\n\n#### Что нового в `v0.3.0-alpha`:\n- **Загрузчик реальных PNG-текстур, локализаций и WAV-звуков (`ResourcePackLoader` + `PngImageDecoder` + `WavPcmDecoder`)**: запустите `Download-Real-Assets.bat` (или положите любой `.zip` ресурс-пак / `.jar` в папку `./resourcepacks/`), и движок автоматически подхватит настоящие PNG-текстуры блоков с биомным окрашиванием травы, листвы и воды!\n- **Многослойный 44.1 кГц физический синтез звуков**: хруст травы, удар по камню с минеральным откликом, гулкое дерево, разрушение блоков и всплески воды.\n- **Прыжок 1.27 блока на любом FPS (30/60/144/240 Гц) + плавание по `Пробелу`**: исправлено независимое от FPS затухание скорости в `KinematicsIntegrator`.\n- **Плавный мультиплеер без рывков**: интерполяция координат и углов друзей на 60–240 Гц, мгновенное клиентское предсказание ломания/установки блоков (0 мс задержки), защита камеры мыши от рывков и отправка движения ровно 20 раз/сек.\n- **Бесшовный свет через границы чанков + мгновенная очистка VRAM далёких чанков**.'
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-zips/*.zip --clobber
            gh release edit "${TAG}" --notes "${NOTES}"
          else
            gh release create "${TAG}" release-zips/*.zip \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Over-the-Horizon: C# EDITION — v0.3.0-alpha" \
              --notes "${NOTES}"
          fi
