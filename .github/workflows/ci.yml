name: CI & Playable Release

on:
  push:
    branches:
      - main
      - "arena/**"
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore OverHorizon.sln

      - name: Build (Release, warnings as errors)
        shell: bash
        run: |
          set -o pipefail
          dotnet build OverHorizon.sln --configuration Release --no-restore -warnaserror 2>&1 | tee build.log || {
            grep -E "error [A-Z0-9]+:" build.log | sed -E 's#^.*/src/#src/#; s#^.*/tests/#tests/#' | awk '!seen[$0]++' | head -n 10 | while IFS= read -r line; do
              echo "::notice::BUILD_ERR: ${line}"
            done
            echo "### Build Errors (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -E "error [A-Z0-9]+:" build.log | head -n 80 >> "$GITHUB_STEP_SUMMARY" || tail -n 80 build.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

      - name: Run unit & architecture tests
        shell: bash
        run: |
          set -o pipefail
          dotnet test tests/OverHorizon.Tests/OverHorizon.Tests.csproj --configuration Release --no-build --verbosity normal --collect:"XPlat Code Coverage" 2>&1 | tee test.log || {
            grep -E "Failed |Error Message:|Expected |Stack Trace:|at OverHorizon" test.log | head -n 20 | while IFS= read -r line; do
              echo "::error::${line}"
            done
            echo "### Test Failures (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 120 test.log >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }
          echo "### Passed (${{ matrix.os }})" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "Passed!|Total tests:" test.log >> "$GITHUB_STEP_SUMMARY" || tail -n 15 test.log >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build-and-test-macos:
    if: github.event_name == 'push'
    runs-on: macos-latest
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build and test (macOS)
        run: dotnet test OverHorizon.sln --configuration Release -warnaserror --verbosity minimal

  package-and-release:
    needs: build-and-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Package self-contained builds (Windows, Linux, macOS)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-zips
          for rid in win-x64 linux-x64 osx-arm64 osx-x64; do
            pkg_name="OverHorizon-v0.5.0-alpha-${rid}"
            stage_dir="stage/${pkg_name}"
            mkdir -p "${stage_dir}"

            dotnet publish src/OverHorizon.Server/OverHorizon.Server.csproj \
              -c Release -r "${rid}" --self-contained true \
              -p:DebugType=None -p:DebugSymbols=false \
              -o "${stage_dir}"

            dotnet publish src/OverHorizon.Client/OverHorizon.Client.csproj \
              -c Release -r "${rid}" --self-contained true \
              -p:DebugType=None -p:DebugSymbols=false \
              -o "${stage_dir}"

            cp scripts/HOW-TO-PLAY-RU.txt "${stage_dir}/"
            if [[ "${rid}" == "win-x64" ]]; then
              cp scripts/*.bat scripts/*.ps1 "${stage_dir}/"
            else
              cp scripts/*.sh "${stage_dir}/"
              chmod +x "${stage_dir}"/*.sh "${stage_dir}"/*.bat 2>/dev/null || true
              chmod +x "${stage_dir}/OverHorizon.Server" "${stage_dir}/OverHorizon.Client"
            fi

            (cd stage && zip -r -q "../release-zips/${pkg_name}.zip" "${pkg_name}")
          done
          ls -lh release-zips/

      - name: Upload Playable Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OverHorizon-v0.5.0-alpha-playable-builds
          path: release-zips/*.zip
          retention-days: 30

      - name: Publish or Update GitHub Pre-Release v0.5.0-alpha
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v0.5.0-alpha"
          NOTES=$'### Over-the-Horizon: C# EDITION (`v0.5.0-alpha`) — 64 чанка без лагов, оригинальный GUI `23w13a__or__b`, полёт в Креативе, 3D-предметы, Верстак 3x3 + Печь, Пещеры + Шахты, Освещение `0..15` и 8 видов 3D-мобов!\n\nГотовые самодостаточные сборки (**установка .NET не требуется!**):\n- **Windows 10/11 (x64)**: `OverHorizon-v0.5.0-alpha-win-x64.zip`\n- **Linux (x86_64)**: `OverHorizon-v0.5.0-alpha-linux-x64.zip`\n- **macOS Apple Silicon (M1–M4)**: `OverHorizon-v0.5.0-alpha-osx-arm64.zip`\n- **macOS Intel (x64)**: `OverHorizon-v0.5.0-alpha-osx-x64.zip`\n\n#### Что нового в `v0.5.0-alpha`:\n1. **Оригинальные GUI-текстуры и виджеты `23w13a__or__b`**: автоматическое скачивание и компоновка `icons.png`, `widgets.png`, `slider.png`, `inventory.png`, `crafting_table.png`, `furnace.png` и `container_27.png` в текстурный атлас `512x768`, плюс настоящие перетягиваемые ползунки (`FOV`, `Render Distance 2..64`, `Volume`, `Sensitivity`).\n2. **Дальность прорисовки до 64 чанков без фризов**: приоритетная концентрическая подгрузка от ближайших к игроку чанков + неблокирующая фоновая очередь мешинга с лимитом загрузки в GPU за кадр.\n3. **Чёткая физика без «льда» и полёт в Креативе**: убрано скольжение после отпускания `WASD`, добавлен свободный полёт в Креативе (двойной `Пробел` или клавиша `F`, взлёт на `Пробел`, снижение на `C`/`Ctrl`).\n4. **Настоящая 3D-модель блоков и предметов в руке**: текстурированные 3D-блоки, факелы и объёмные пиксель-арт инструменты/мечи в правой руке с живым освещением мира.\n5. **Оригинальный инвентарь Выживания (`2x2`), Верстак (`3x3`), Печь, 52 блока и 102 предмета**: курсорное перетаскивание стаков (ЛКМ/ПКМ/`Shift`+клик), 4 слота брони с защитой на HUD, 60+ рецептов крафта (`2x2` и `3x3`), плавка руд и еды в Печи (`Furnace` -> `LitFurnace`).\n6. **Богатая генерация мира**: 3D-пещеры (сырные гроты и спагетти-туннели), глубинный сланец (`Deepslate` ниже `Y=8`), жилы 7 руд по высотам, заброшенные шахты (`Mineshafts` с дубовыми подпорками, рельсами, паутиной и факелами) и дубово-берёзовые леса.\n7. **Настоящее освещение `0..15` и динамический факел в руке**: раздельные каналы `SkyLight` и `BlockLight` (в пещерах темно без факелов!), тёплый оранжевый свет факелов/фонарей/печей + динамическая подсветка стен вокруг игрока с факелом/фонарём в руке.\n8. **8 видов 3D-мобов (мирные и враждебные)**: Свинья, Корова, Овца (стрижётся ножницами!), Курица, Зомби, Скелет, Паук и Крипер (шипит, мигает и взрывается!) с анимацией лап, ИИ и дропом.'
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" release-zips/*.zip --clobber
            gh release edit "${TAG}" --notes "${NOTES}"
          else
            gh release create "${TAG}" release-zips/*.zip \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "Over-the-Horizon: C# EDITION — v0.5.0-alpha" \
              --notes "${NOTES}"
          fi
